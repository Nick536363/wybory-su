<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dodaj użytkownika</title>

    <style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;
    background-color: #f3f5f8;
    color: #263238;
}

/* Карточка формы */
form {
    width: 100%;
    max-width: 380px;
    padding: 32px;

    background-color: #ffffff;
    border: 1px solid #e3e8ef;
    border-radius: 14px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.05);
}

/* Поля ввода */
input {
    display: block;
    width: 100%;
    margin-bottom: 18px;
    padding: 12px 14px;

    font-family: inherit;
    font-size: 16px;
    color: #263238;
    background-color: #ffffff;

    border: 1px solid #cbd5e1;
    border-radius: 8px;
    outline: none;

    transition: border-color 0.2s, box-shadow 0.2s;
}

input:focus {
    border-color: #3978e5;
    box-shadow: 0 0 0 3px rgba(57, 120, 229, 0.15);
}

/* Кнопка */
button {
    display: block;
    width: 100%;
    padding: 12px 16px;

    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    color: #ffffff;
    background-color: #3978e5;

    border: none;
    border-radius: 8px;
    cursor: pointer;

    transition: background-color 0.2s, transform 0.1s;
}

button:hover {
    background-color: #2863c7;
}

button:active {
    transform: scale(0.98);
}

button:focus-visible {
    outline: 3px solid rgba(57, 120, 229, 0.25);
    outline-offset: 3px;
}

/* Мобильные устройства */
@media (max-width: 480px) {
    form {
        padding: 24px;
    }
}
</style>

</head>
<body>
    <form method="POST" action="/add_user">
        <input id="username" name="username" type="text" placeholder="Username" autofocus>
        <input id="pass" name="pass" type="password" placeholder="Hasło">
        <label>Czy admin?</label>
        <input id="admin" name="admin" type="checkbox">
        <button type="submit">Zatwierdź</button>
    </form>
</body>
</html>
